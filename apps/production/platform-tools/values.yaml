certManager:
  enabled: true
  email: your-email@example.com
  clusterIssuer: letsencrypt-prod

externalDns:
  enabled: true
  provider: aws
  domainFilter: "example.com"
  txtOwnerID: "my-cluster-production"

clusterAutoscaler:
  enabled: true
  awsRegion: us-east-1
  clusterName: my-cluster-production
